[project]
name = "agentic-rag-notebook"
version = "0.1.0"
description = "Modern Agentic RAG Notebook chatbot using uv, LangChain, Docling, ChromaDB, Groq, and Local OpenAI (Qwen) with middleware guardrails and SQLite URL sessions."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Developer", email = "developer@example.com" },
]
keywords = ["rag", "agentic-rag", "langchain", "langgraph", "docling", "streamlit", "groq", "qwen"]
dependencies = [
    "chromadb>=0.6.0",
    "docling>=2.25.0",
    "langchain>=1.0.0",
    "langchain-chroma>=0.2.0",
    "langchain-community>=0.4.0",
    "langchain-core>=1.0.0",
    "langchain-docling>=1.0.0",
    "langchain-groq>=1.0.0",
    "langchain-huggingface>=0.3.0",
    "langchain-openai>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sentence-transformers>=3.3.0",
    "streamlit>=1.42.0",
    "transformers>=4.48.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
agentic-rag-ui = "agentic_rag_notebook.ui.runner:main"
agentic-rag-check-env = "agentic_rag_notebook.config.doctor:main"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag_notebook"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # handled by formatter where needed
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["agentic_rag_notebook"]
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
pythonpath = ["src"]
markers = [
    "integration: marks end-to-end integration tests",
]
